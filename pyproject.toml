[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kgraphing-ontology-datamodelling"
version = "0.0.4"
description = "This project covers templates, mappings and materials used to collate a coherent data architecture picture covering vocabulary definitions, conceptual data models, logical and physical models and inter-classification mappings. Other capabilities might include data harvesting patterns to help manage, ingest and decompose complex and heterogenic data sources. "
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gravis",
    "kgraphing",
    "svgtext",
    "tpipe",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/kgraphing_ontology_datamodelling"]

[tool.uv.sources]
gravis = { url = "https://github.com/raufs/gravis/archive/refs/tags/v0.1.1.tar.gz" }
