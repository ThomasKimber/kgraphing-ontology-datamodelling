[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kgraphing-ontology-datamodelling"
version = "0.0.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gravis",
    "kgraphing",
    "svgtext",
    "tpipe",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/kgraphing_ontology_datamodelling"]

[tool.uv.sources]
gravis = { url = "https://github.com/raufs/gravis/archive/refs/tags/v0.1.1.tar.gz" }
