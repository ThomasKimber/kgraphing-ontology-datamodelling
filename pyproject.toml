[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kgraphing-ontology-datamodelling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gravis",
    "kgraphing",
    "svgtext",
    "tpipe",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/kgraphing_ontology_datamodelling"]

[tool.uv.sources]
gravis = { url = "https://github.com/raufs/gravis/archive/refs/tags/v0.1.1.tar.gz" }
kgraphing = { url = "https://github.com/ThomasKimber/kgraph/releases/download/v0.001/kgraphing-0.0.1-py3-none-any.whl" }
tpipe = { url = "https://github.com/ThomasKimber/tpipe/releases/download/v0.001/tpipe-0.1.0-py3-none-any.whl" }
svgtext = { url = "https://github.com/ThomasKimber/svgtext/releases/download/v0.001/svgtext-0.1.0-py3-none-any.whl" }
